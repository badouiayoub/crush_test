
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me?</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff758c, #ff7eb3, #ffc3a0);
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 420px;
            padding: 50px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 25px;
            box-shadow: 0 15px 45px rgba(160, 50, 80, 0.2);
            animation: appear 0.8s ease;
        }

        .heart {
            font-size: 65px;
            margin-bottom: 20px;
            animation: heartbeat 1.2s infinite;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
        }

        p {
            color: #fff;
            font-size: 16px;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            padding: 13px 35px;
            border: none;
            border-radius: 50px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #yesButton {
            background: #fff;
            color: #ff4f81;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        #yesButton:hover {
            transform: translateY(-5px) scale(1.08);
            background: #ff4f81;
            color: white;
        }

        #noButton {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
        }

        #noButton:hover {
            background: white;
            color: #ff4f81;
            transform: translateY(-5px);
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Floating hearts */
        .floating-heart {
            position: absolute;
            bottom: -50px;
            font-size: 25px;
            opacity: 0.6;
            animation: floatUp 7s linear infinite;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            20% { opacity: 0.6; }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="heart">❤️</div>

        <h1>Do You Love Me?</h1>

        <p>Be honest... my heart is waiting! 🥺</p>

        <div class="buttons">
            <button id="yesButton" onclick="yes()">Yes ❤️</button>
            <button id="noButton" onclick="no()">No 💔</button>
        </div>
    </div>

    <script>
        function yes() {
            let phone = "96171474339";
            let message = "I love you Badouch ❤️";

            let url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;

            window.open(url, "_blank");
        }

        function no() {
            alert("Wrong answer! Try again 😂❤️");s
        }

        // Create floating hearts
        function createHeart() {
            let heart = document.createElement("div");

            heart.classList.add("floating-heart");
            heart.innerHTML = "❤️";

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (Math.random() * 4 + 4) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 8000);
        }

        setInterval(createHeart, 600);
    </script>

</body>
</html>
